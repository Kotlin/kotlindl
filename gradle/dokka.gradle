def documentedSubprojects = ["api", "impl", "dataset", "tensorflow", "tensorflow-metal", "onnx", "visualization", "examples"]

subprojects {
    if (!(name in documentedSubprojects)) return
    apply plugin: 'org.jetbrains.dokka'
    dokka {
        dokkaSourceSets.configureEach {
            includes.from(rootProject.file('dokka/moduledoc.md'))
        }
    }
}

dokka {
    moduleName.set("KotlinDL")
    dokkaPublications.html {
        outputDirectory.set(layout.buildDirectory.dir("dokka"))
    }
}

dependencies {
    documentedSubprojects.each { dokka(project(":$it")) }
}
